<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create New User</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body class="bg-gray-900 text-white font-sans">
<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold mb-4">Create New User</h1>
  <form th:action="@{/users/signup}" method="post" th:object="${user}">
    <div class="mb-4">
      <label for="username" class="block text-gray-300 text-sm font-bold mb-2">Username:</label>
      <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
             id="username" name="username" th:field="*{username}" required>
    </div>
    <div class="mb-4">
      <label for="password" class="block text-gray-300 text-sm font-bold mb-2">Password:</label>
      <input type="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
             id="password" name="password" th:field="*{password}" required>
    </div>
    <div class="mb-4">
      <label for="email" class="block text-gray-300 text-sm font-bold mb-2">Email:</label>
      <input type="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
             id="email" name="email" th:field="*{email}" required>
    </div>
    <div class="mb-4">
      <label for="fullName" class="block text-gray-300 text-sm font-bold mb-2">Full Name:</label>
      <input type="text" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
             id="fullName" name="fullName" th:field="*{fullName}" required>
    </div>
    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Create User</button>
  </form>

  <div class="mt-4">
    <a th:href="@{/users}" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Back to Users</a>
  </div>
</div>
</body>
</html>
